<template>
  <div class={scaleClass} data-compact={compact}>
    <div class="ends">
      <span class="end-label">{minLabel}</span>
      <template lwc:if={hasValue}>
        <span class="badge">{valueLabel}</span>
      </template>
      <span class="end-label end-label_max">{maxLabel}</span>
    </div>

    <div class="track-wrap">
      <input
        type="range"
        min={min}
        max="10"
        step="1"
        class={trackClass}
        style={trackStyle}
        value={rangeValue}
        aria-label={ariaLabel}
        onchange={handleSlider}
        oninput={handleSlider}
      />

      <div
        class={buttonsClass}
        role="group"
        aria-label={ariaLabel}
        aria-invalid={showInvalid}
      >
        <template for:each={choices} for:item="choice">
          <button
            key={choice.value}
            type="button"
            class={choice.className}
            data-value={choice.value}
            aria-pressed={choice.selected}
            onclick={handleChoice}
          >
            {choice.value}
          </button>
        </template>
      </div>
    </div>

    <template lwc:if={showInvalid}>
      <p class="invalid-note" role="alert">Bitte wählen Sie eine Bewertung.</p>
    </template>

    <template lwc:if={showComment}>
      <div class="comment">
        <label class="comment-prompt" for="comment-box">
          {commentPrompt}
        </label>
        <textarea
          id="comment-box"
          class="comment-box"
          rows="2"
          placeholder={commentPlaceholder}
          onchange={handleComment}
        ></textarea>
      </div>
    </template>
  </div>
</template>
