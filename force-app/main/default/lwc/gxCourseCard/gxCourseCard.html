<template>
  <article class="card">
    <header class="head">
      <c-gx-service-icon name="golf"></c-gx-service-icon>
      <div class="head-text">
        <p class="kind">{labels.s4CourseKind}</p>
        <h3 class="name">{name}</h3>
        <template lwc:if={subtitle}>
          <p class="subtitle">{subtitle}</p>
        </template>
      </div>
    </header>

    <c-gx-rating-scale
      value={score}
      invalid={invalid}
      comment={comment}
      min-label={labels.scalePoor}
      max-label={labels.scaleExcellent}
      aria-label={ratingAriaLabel}
      comment-prompt={commentPrompt}
      comment-placeholder={commentPlaceholder}
      onvaluechange={handleScore}
      oncommentchange={handleComment}
    ></c-gx-rating-scale>
  </article>
</template>
