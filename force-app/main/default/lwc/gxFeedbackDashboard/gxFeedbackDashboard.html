<template>
  <div class="dash">
    <header class="head">
      <div>
        <h1 class="title">Guest feedback</h1>
        <p class="subtitle">
          Post-trip survey results, by the date each trip ended
        </p>
      </div>
      <lightning-button-icon
        icon-name="utility:refresh"
        alternative-text="Refresh"
        title="Refresh"
        onclick={handleRefresh}
      ></lightning-button-icon>
    </header>

    <section class="filters" aria-label="Filters">
      <lightning-input
        type="date"
        label="Trips ending from"
        data-field="fromDate"
        value={filters.fromDate}
        onchange={handleFilter}
      ></lightning-input>
      <lightning-input
        type="date"
        label="To"
        data-field="toDate"
        value={filters.toDate}
        onchange={handleFilter}
      ></lightning-input>
      <lightning-combobox
        label="Region"
        data-field="region"
        value={filters.region}
        options={regionOptions}
        onchange={handleFilter}
      ></lightning-combobox>
      <lightning-combobox
        label="Country"
        data-field="country"
        value={filters.country}
        options={countryOptions}
        onchange={handleFilter}
      ></lightning-combobox>
      <lightning-combobox
        label="Travel type"
        data-field="travelType"
        value={filters.travelType}
        options={travelTypeOptions}
        onchange={handleFilter}
      ></lightning-combobox>
      <lightning-combobox
        label="Category"
        data-field="category"
        value={filters.category}
        options={categoryOptions}
        onchange={handleFilter}
        field-level-help="Narrows the venue sections. NPS and response rate always cover the whole trip."
      ></lightning-combobox>
      <lightning-combobox
        label="Travel designer"
        data-field="designer"
        value={filters.designer}
        options={designerOptions}
        onchange={handleFilter}
      ></lightning-combobox>
      <div class="filter-actions">
        <lightning-button
          variant="base"
          label="All time"
          onclick={handleAllTime}
        ></lightning-button>
        <lightning-button
          variant="base"
          label="Reset"
          onclick={handleReset}
        ></lightning-button>
      </div>
    </section>

    <div class="body">
      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading feedback"
          size="medium"
        ></lightning-spinner>
      </template>

      <template lwc:if={error}>
        <div class="notice" role="alert">{error}</div>
      </template>

      <template lwc:if={data}>
        <section class="kpis" aria-label="Headline numbers">
          <template for:each={kpis} for:item="k">
            <div key={k.key} class="kpi-cell">
              <template lwc:if={k.target}>
                <button
                  class={k.cls}
                  data-target={k.target}
                  title={k.hint}
                  onclick={handleKpiClick}
                >
                  <span class="kpi-label">{k.label}</span>
                  <span class="kpi-value">{k.value}</span>
                  <span class="kpi-note">{k.note}</span>
                </button>
              </template>
              <template lwc:else>
                <div class={k.cls}>
                  <span class="kpi-label">{k.label}</span>
                  <span class="kpi-value">{k.value}</span>
                  <span class="kpi-note">{k.note}</span>
                </div>
              </template>
            </div>
          </template>
        </section>

        <!-- Every response: find one, or work through them -->
        <section class="panel" data-section="responses">
          <div class="panel-head">
            <h2 class="panel-title">Responses</h2>
            <span class="panel-count">{responsesSummary}</span>
            <lightning-button
              class="export-btn"
              label={exportLabel}
              icon-name="utility:download"
              title="Download everything this list shows, all pages, as a spreadsheet"
              disabled={exportDisabled}
              onclick={handleExport}
            ></lightning-button>
          </div>
          <div class="finder">
            <lightning-input
              class="finder-search"
              type="search"
              label="Find a response"
              variant="label-hidden"
              placeholder="Search guest name, email, booking or FB number"
              value={searchInput}
              onchange={handleSearch}
            ></lightning-input>
            <div class="chips" role="group" aria-label="Show">
              <template for:each={groupChips} for:item="c">
                <button
                  key={c.value}
                  class={c.cls}
                  data-value={c.value}
                  aria-pressed={c.pressed}
                  onclick={handleGroup}
                >
                  {c.label}
                </button>
              </template>
            </div>
            <lightning-combobox
              class="finder-sort"
              label="Order"
              variant="label-hidden"
              options={sortOptions}
              value={responseSort}
              onchange={handleSort}
            ></lightning-combobox>
          </div>

          <template lwc:if={hasResponseRows}>
            <ul class="rlist">
              <template for:each={responseRows} for:item="r">
                <li key={r.key} class="rrow">
                  <span class={r.npsCls}>{r.npsLabel}</span>
                  <div class="rmain">
                    <p class="meta rwho">
                      <span class="rguest">{r.guest}</span>
                      <span aria-hidden="true">·</span>
                      <a href={r.url}>{r.bookingNumber}</a>
                      <span aria-hidden="true">·</span>
                      <span>{r.reference}</span>
                    </p>
                    <p class="meta rtrip">
                      <span>{r.trip}</span>
                      <template lwc:if={r.designer}>
                        <span aria-hidden="true">·</span>
                        <span>{r.designer}</span>
                      </template>
                    </p>
                    <p class="rfacts">
                      <span class="rfact">
                        <span>Overall</span>
                        <span class={r.overallCls}>{r.overall}</span>
                      </span>
                      <template lwc:if={r.lowest}>
                        <span class="rfact">
                          <span>Lowest: {r.lowest.label}</span>
                          <span class={r.lowest.cls}>{r.lowest.score}</span>
                        </span>
                      </template>
                      <template lwc:if={r.commentsLabel}>
                        <span class="rfact">{r.commentsLabel}</span>
                      </template>
                      <template lwc:if={r.statusLabel}>
                        <span class={r.statusCls}>{r.statusLabel}</span>
                      </template>
                    </p>
                  </div>
                  <button
                    class="link-btn full-btn"
                    data-response-id={r.responseId}
                    title="Open the guest's whole answer"
                    onclick={handleOpenResponse}
                  >
                    Full response
                  </button>
                </li>
              </template>
            </ul>
            <c-gx-pager
              label="Pages of responses"
              total={responsesTotal}
              page={responsesPageNo}
              page-size={responsesPageSize}
              onpagechange={handleResponsePage}
            ></c-gx-pager>
            <template lwc:if={responsesCapNote}>
              <p class="panel-note">{responsesCapNote}</p>
            </template>
          </template>
          <template lwc:elseif={responsesLoading}>
            <p class="panel-note">Loading responses…</p>
          </template>
        </section>

        <template lwc:if={isEmpty}>
          <div class="empty">
            <h2 class="empty-title">No feedback for these trips yet</h2>
            <p>
              Invitations go out 36 hours after a trip ends, so recent trips
              fill in over the following weeks. Try widening the dates or
              clearing a filter.
            </p>
          </div>
        </template>

        <template lwc:else>
          <!-- Trend -->
          <section class="panel">
            <div class="panel-head">
              <h2 class="panel-title">NPS by trip month</h2>
              <div class="legend" aria-hidden="true">
                <span><i class="sw sw_pro"></i>Promoters</span>
                <span><i class="sw sw_pas"></i>Passives</span>
                <span><i class="sw sw_det"></i>Detractors</span>
              </div>
            </div>
            <template lwc:if={hasTrend}>
              <div class="trend">
                <div class="trend-row trend-head" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span class="trend-nps">NPS</span>
                  <span class="trend-n">Responses</span>
                </div>
                <template for:each={trend} for:item="m">
                  <div key={m.key} class="trend-row">
                    <span class="trend-month">{m.label}</span>
                    <span class="trend-bar" title={m.summary}>
                      <span class="seg seg_pro" style={m.promoterStyle}></span>
                      <span class="seg seg_pas" style={m.passiveStyle}></span>
                      <span class="seg seg_det" style={m.detractorStyle}></span>
                    </span>
                    <span class="trend-nps">{m.nps}</span>
                    <span class="trend-n">{m.total}</span>
                  </div>
                </template>
              </div>
              <p class="panel-note">
                The current month keeps filling in as guests reply.
              </p>
            </template>
            <template lwc:else>
              <p class="panel-note">
                No trip dates to chart in this selection.
              </p>
            </template>
          </section>

          <!-- Travel designers -->
          <template lwc:if={hasDesigners}>
            <section class="panel" data-section="designers">
              <div class="panel-head">
                <h2 class="panel-title">Travel designers</h2>
                <template lwc:if={designerFiltered}>
                  <lightning-button
                    variant="base"
                    label="Show all designers"
                    onclick={clearDesigner}
                  ></lightning-button>
                </template>
              </div>
              <p class="panel-note">
                Consultation is how guests rated our advice and product choice.
                Select a designer to see the whole dashboard for their trips
                only.
              </p>
              <div class="heat-wrap">
                <table class="dtable">
                  <thead>
                    <tr>
                      <th scope="col" class="dname">Travel designer</th>
                      <th scope="col">Responses</th>
                      <th scope="col">Consultation</th>
                      <th scope="col">NPS</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={designerPage.rows} for:item="d">
                      <tr key={d.key} class={d.rowCls}>
                        <th scope="row" class="dname">
                          <button
                            class="link-btn"
                            data-id={d.id}
                            aria-pressed={d.active}
                            title="Show only this designer's trips"
                            onclick={handleDesignerSelect}
                          >
                            {d.name}
                          </button>
                        </th>
                        <td>{d.responses}</td>
                        <td>
                          <span class={d.consultCls}>{d.consultation}</span>
                        </td>
                        <td class="dnps">{d.nps}</td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <c-gx-pager
                data-list="designers"
                label="Pages of travel designers"
                total={designerPage.total}
                page={designerPage.page}
                onpagechange={handlePage}
              ></c-gx-pager>
            </section>
          </template>

          <!-- Venues -->
          <section class="panel">
            <div class="panel-head">
              <h2 class="panel-title">How our venues and partners score</h2>
            </div>
            <p class="panel-note">{rankingHint}</p>
            <div class="boards">
              <c-gx-venue-board
                title="Hotels"
                board={hotelBoard}
                min-ratings={minRatings}
                onselect={handleVenueSelect}
              ></c-gx-venue-board>
              <c-gx-venue-board
                title="Golf courses"
                board={golfBoard}
                min-ratings={minRatings}
                onselect={handleVenueSelect}
              ></c-gx-venue-board>
              <c-gx-venue-board
                title="Airlines, transfers and rental cars"
                board={supplierBoard}
                min-ratings={minRatings}
                onselect={handleVenueSelect}
              ></c-gx-venue-board>
            </div>

            <template lwc:if={drill}>
              <div
                class="drill"
                data-section="drill"
                role="region"
                aria-label={drillTitle}
              >
                <div class="drill-head">
                  <div>
                    <h3 class="drill-title">{drillTitle}</h3>
                    <span class="drill-count">{drillCount}</span>
                  </div>
                  <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    variant="bare"
                    onclick={closeDrill}
                  ></lightning-button-icon>
                </div>
                <template lwc:if={drill.loading}>
                  <p class="panel-note">Loading ratings…</p>
                </template>
                <template lwc:else>
                  <template for:each={drillPage.rows} for:item="r">
                    <div key={r.key} class="drill-row">
                      <span class={r.cls}>{r.score}</span>
                      <div class="drill-main">
                        <div class="meta drill-who">
                          <a href={r.url}>{r.bookingNumber}</a>
                          <span aria-hidden="true">·</span>
                          <span>{r.guest}</span>
                          <span aria-hidden="true">·</span>
                          <button
                            class="link-btn full-btn"
                            data-response-id={r.responseId}
                            title="Open the guest's whole answer"
                            onclick={handleOpenResponse}
                          >
                            Full response
                          </button>
                        </div>
                        <template lwc:if={r.comment}>
                          <div class="drill-comment">{r.comment}</div>
                        </template>
                        <div class="drill-subs">
                          <template for:each={r.subs} for:item="s">
                            <span key={s.key} class="sub"
                              >{s.label} {s.value}</span
                            >
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                  <c-gx-pager
                    data-list="drill"
                    label="Pages of ratings for this venue"
                    total={drillPage.total}
                    page={drillPage.page}
                    onpagechange={handlePage}
                  ></c-gx-pager>
                </template>
              </div>
            </template>
          </section>

          <!-- Hotel detail -->
          <template lwc:if={hasHotelDetail}>
            <section class="panel" data-section="heat">
              <div class="panel-head">
                <h2 class="panel-title">Hotel detail</h2>
                <div class="legend" aria-hidden="true">
                  <span><i class="sw heat_bad"></i>Below 7</span>
                  <span><i class="sw heat_mid"></i>7 to 7.9</span>
                  <span><i class="sw heat_good"></i>8 and above</span>
                </div>
              </div>
              <p class="panel-note">
                Guests only see these four questions when they score a hotel
                below 9, so this is where the reasons for low hotel scores show
                up.
              </p>
              <div class="heat-wrap">
                <table class="heat-table">
                  <thead>
                    <tr>
                      <th scope="col" class="heat-hotel">Hotel</th>
                      <th scope="col">Room</th>
                      <th scope="col">Service</th>
                      <th scope="col">Catering</th>
                      <th scope="col">Cleanliness</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={heatPage.rows} for:item="row">
                      <tr key={row.key}>
                        <th scope="row" class="heat-hotel">
                          <button
                            class="link-btn"
                            data-name={row.hotel}
                            data-category="Hotel"
                            title="Show every rating for this hotel"
                            onclick={handleHeatSelect}
                          >
                            {row.hotel}
                          </button>
                        </th>
                        <template for:each={row.cells} for:item="c">
                          <td key={c.key} class={c.cls} title={c.title}>
                            {c.value}
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <c-gx-pager
                data-list="heat"
                label="Pages of hotels"
                total={heatPage.total}
                page={heatPage.page}
                onpagechange={handlePage}
              ></c-gx-pager>
            </section>
          </template>

          <div class="two">
            <!-- Follow-up -->
            <section class="panel" data-section="followups">
              <div class="panel-head">
                <h2 class="panel-title">Unhappy guests to follow up</h2>
                <lightning-button
                  variant="base"
                  label={handledToggleLabel}
                  onclick={toggleHandled}
                ></lightning-button>
              </div>
              <template lwc:if={followUpCapNote}>
                <p class="panel-note">{followUpCapNote}</p>
              </template>
              <template lwc:if={hasFollowUps}>
                <template for:each={followUpPage.rows} for:item="r">
                  <div key={r.key} class="fu">
                    <div class="fu-top">
                      <span class="pill pill_bad">{r.npsLabel}</span>
                      <div class="meta fu-who">
                        <a href={r.url}>{r.bookingNumber}</a>
                        <span aria-hidden="true">·</span>
                        <span>{r.detail}</span>
                      </div>
                      <button
                        class="link-btn full-btn"
                        data-response-id={r.responseId}
                        title="Open the guest's whole answer"
                        onclick={handleOpenResponse}
                      >
                        Full response
                      </button>
                    </div>
                    <p class="fu-comment">{r.comment}</p>
                    <template lwc:if={r.followUpBy}>
                      <p class="meta fu-meta">
                        <span>{r.updatedLabel}</span>
                        <span aria-hidden="true">·</span>
                        <lightning-formatted-date-time
                          value={r.followUpOn}
                          year="numeric"
                          month="short"
                          day="numeric"
                        ></lightning-formatted-date-time>
                      </p>
                    </template>
                    <div class="fu-actions">
                      <lightning-combobox
                        class="fu-status"
                        label="Status"
                        variant="label-hidden"
                        options={followUpOptions}
                        value={r.draftStatus}
                        data-id={r.key}
                        onchange={handleStatusChange}
                      ></lightning-combobox>
                      <lightning-input
                        class="fu-note"
                        label="Note"
                        variant="label-hidden"
                        placeholder="What was done, e.g. called and offered a voucher"
                        value={r.draftNote}
                        data-id={r.key}
                        onchange={handleNoteChange}
                      ></lightning-input>
                      <lightning-button
                        label="Save"
                        data-id={r.key}
                        onclick={handleSaveFollowUp}
                        disabled={r.saving}
                      ></lightning-button>
                    </div>
                  </div>
                </template>
                <c-gx-pager
                  data-list="followups"
                  label="Pages of unhappy guests"
                  total={followUpPage.total}
                  page={followUpPage.page}
                  onpagechange={handlePage}
                ></c-gx-pager>
              </template>
              <template lwc:else>
                <p class="panel-note">{followUpEmptyText}</p>
              </template>
            </section>

            <!-- Next destinations -->
            <section class="panel" data-section="destinations">
              <div class="panel-head">
                <h2 class="panel-title">Where guests want to go next</h2>
              </div>
              <p class="panel-note">
                Happiest guests first — the warmest leads for their next trip.
              </p>
              <template lwc:if={destinationsCapNote}>
                <p class="panel-note">{destinationsCapNote}</p>
              </template>
              <template lwc:if={hasDestinations}>
                <ul class="dest">
                  <template for:each={destinationPage.rows} for:item="d">
                    <li key={d.key} class="dest-row">
                      <span class="dest-wish">{d.wish}</span>
                      <span class="meta dest-who">
                        <span>{d.guest}</span>
                        <span aria-hidden="true">·</span>
                        <a href={d.url}>{d.bookingNumber}</a>
                        <span aria-hidden="true">·</span>
                        <button
                          class="link-btn full-btn"
                          data-response-id={d.responseId}
                          title="Open the guest's whole answer"
                          onclick={handleOpenResponse}
                        >
                          Full response
                        </button>
                      </span>
                      <template lwc:if={d.promoter}>
                        <span class="pill pill_good">{d.npsLabel}</span>
                      </template>
                      <template lwc:else>
                        <span class="pill pill_none">{d.npsLabel}</span>
                      </template>
                    </li>
                  </template>
                </ul>
                <c-gx-pager
                  data-list="destinations"
                  label="Pages of next destinations"
                  total={destinationPage.total}
                  page={destinationPage.page}
                  onpagechange={handlePage}
                ></c-gx-pager>
              </template>
              <template lwc:else>
                <p class="panel-note">
                  Nobody has named a next destination in this selection.
                </p>
              </template>
            </section>
          </div>

          <!-- Comments -->
          <section class="panel" data-section="comments">
            <div class="panel-head">
              <h2 class="panel-title">What guests wrote</h2>
              <lightning-button
                variant="base"
                label={lowOnlyLabel}
                onclick={toggleLowOnly}
              ></lightning-button>
            </div>
            <template lwc:if={commentsCapNote}>
              <p class="panel-note">{commentsCapNote}</p>
            </template>
            <template lwc:if={hasComments}>
              <ul class="comments">
                <template for:each={commentPage.rows} for:item="c">
                  <li key={c.key} class="comment">
                    <template lwc:if={c.score}>
                      <span class={c.cls}>{c.score}</span>
                    </template>
                    <template lwc:else>
                      <span class="pill pill_none">–</span>
                    </template>
                    <div class="comment-main">
                      <p class="comment-text">{c.text}</p>
                      <p class="meta comment-meta">
                        <span>{c.about}</span>
                        <span aria-hidden="true">·</span>
                        <span>{c.guest}</span>
                        <span aria-hidden="true">·</span>
                        <a href={c.url}>{c.bookingNumber}</a>
                        <span aria-hidden="true">·</span>
                        <button
                          class="link-btn full-btn"
                          data-response-id={c.responseId}
                          title="Open the guest's whole answer"
                          onclick={handleOpenResponse}
                        >
                          Full response
                        </button>
                      </p>
                    </div>
                  </li>
                </template>
              </ul>
              <c-gx-pager
                data-list="comments"
                label="Pages of comments"
                total={commentPage.total}
                page={commentPage.page}
                onpagechange={handlePage}
              ></c-gx-pager>
            </template>
            <template lwc:else>
              <p class="panel-note">{commentsEmptyText}</p>
            </template>
          </section>
        </template>

        <!-- Invited, not answered yet -->
        <section class="panel" data-section="waiting">
          <div class="panel-head">
            <h2 class="panel-title">Waiting for an answer</h2>
            <span class="panel-count">{waitingSummary}</span>
          </div>
          <p class="panel-note">
            Guests who were sent the survey and have not answered, most recently
            asked first. One reminder goes out automatically; a personal word
            from the travel designer often does more.
          </p>
          <template lwc:if={hasWaiting}>
            <ul class="rlist">
              <template for:each={waitingList} for:item="w">
                <li key={w.key} class="wrow">
                  <div class="rmain">
                    <p class="meta rwho">
                      <span class="rguest">{w.guest}</span>
                      <span aria-hidden="true">·</span>
                      <a href={w.url}>{w.bookingNumber}</a>
                    </p>
                    <p class="meta rtrip">
                      <span>{w.trip}</span>
                      <template lwc:if={w.designer}>
                        <span aria-hidden="true">·</span>
                        <span>{w.designer}</span>
                      </template>
                    </p>
                  </div>
                  <div class="wstate">
                    <span class="wsent">{w.sentLabel}</span>
                    <span class={w.stateCls}>{w.stateLabel}</span>
                  </div>
                </li>
              </template>
            </ul>
            <c-gx-pager
              label="Pages of guests waiting"
              total={waitingTotal}
              page={waitingPageNo}
              page-size={waitingPageSize}
              onpagechange={handleWaitingPage}
            ></c-gx-pager>
          </template>
          <template lwc:else>
            <p class="panel-note">
              Everyone invited in this selection has answered.
            </p>
          </template>
        </section>
      </template>
    </div>
  </div>
</template>
