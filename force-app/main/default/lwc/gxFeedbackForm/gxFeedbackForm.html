<template>
  <div class="shell">
    <div class="survey">
      <header class="brand">
        <img src={logoUrl} alt="golf.extra" class="logo" />
        <template lwc:if={showQuestions}>
          <!-- translate="no" on text that changes in place: browser translation
               swaps the text for its own copy, which then never updates. -->
          <span class="step" translate="no">{stepLabel}</span>
        </template>
      </header>

      <template lwc:if={isLoading}>
        <p class="state">{labels.loading}</p>
      </template>

      <template lwc:if={isInvalid}>
        <div class="state state_notice">
          <h2 class="state-title">{labels.invalidTitle}</h2>
          <p>{labels.invalidText}</p>
        </div>
      </template>

      <template lwc:if={isAlreadySubmitted}>
        <div class="state state_notice">
          <h2 class="state-title">{labels.submittedTitle}</h2>
          <p>{labels.submittedText}</p>
        </div>
      </template>

      <template lwc:if={isExpired}>
        <div class="state state_notice">
          <h2 class="state-title">{labels.expiredTitle}</h2>
          <p>{labels.expiredText}</p>
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <div class="state state_notice">
          <h2 class="state-title">{labels.emptyTitle}</h2>
          <p>{labels.emptyText}</p>
        </div>
      </template>

      <template lwc:if={showQuestions}>
        <div class="progress">
          <div class="progress-meta">
            <span>{labels.progress}</span>
            <span translate="no">{progressPercentLabel}</span>
          </div>
          <div class="progress-rail">
            <div class="progress-fill" style={progressStyle}></div>
          </div>
        </div>

        <!-- SCREEN 1 -->
        <template lwc:if={onOverall}>
          <section class="screen">
            <h2 class="title">{labels.s1Title}</h2>

            <div class="question">
              <label class="question-label">{labels.s1OverallQuestion}</label>
              <c-gx-rating-scale
                data-field="overallExperience"
                data-missing={invalidMap.overallExperience}
                invalid={invalidMap.overallExperience}
                value={answers.overallExperience}
                comment={answers.overallExperienceComment}
                min-label={labels.scalePoor}
                max-label={labels.scaleExcellent}
                aria-label={labels.s1OverallAria}
                comment-prompt={labels.s1OverallPrompt}
                comment-placeholder={labels.s1OverallHint}
                onvaluechange={handleScore}
                oncommentchange={handleOverallComment}
              ></c-gx-rating-scale>
            </div>

            <div class="question">
              <label class="question-label">{labels.s1ConsultQuestion}</label>
              <c-gx-rating-scale
                data-field="consultation"
                data-missing={invalidMap.consultation}
                invalid={invalidMap.consultation}
                value={answers.consultation}
                comment={answers.consultationComment}
                min-label={labels.scaleVeryUnhappy}
                max-label={labels.scaleVeryHappy}
                aria-label={labels.s1ConsultAria}
                comment-prompt={labels.s1ConsultPrompt}
                comment-placeholder={labels.s1ConsultHint}
                onvaluechange={handleScore}
                oncommentchange={handleConsultationComment}
              ></c-gx-rating-scale>
            </div>
          </section>
        </template>

        <!-- SCREEN 2 -->
        <template lwc:if={onMobility}>
          <section class="screen">
            <h2 class="title">{labels.s2Title}</h2>

            <template lwc:if={ctx.hasFlight}>
              <div class="question">
                <div class="question-head">
                  <label class="question-label"
                    >{labels.s2FlightQuestion}</label
                  >
                  <template lwc:if={flightBadge}>
                    <span class="badge">{flightBadge}</span>
                  </template>
                </div>
                <c-gx-rating-scale
                  data-field="flight"
                  data-missing={invalidMap.flight}
                  invalid={invalidMap.flight}
                  value={answers.flight.score}
                  comment={answers.flight.comment}
                  min-label={labels.scaleVeryUnhappy}
                  max-label={labels.scaleVeryHappy}
                  aria-label={labels.s2FlightAria}
                  comment-prompt={labels.s2FlightPrompt}
                  comment-placeholder={labels.s2FlightHint}
                  onvaluechange={handleServiceScore}
                  oncommentchange={handleServiceComment}
                ></c-gx-rating-scale>
              </div>
            </template>

            <template lwc:if={ctx.hasTransfers}>
              <div class="question">
                <div class="question-head">
                  <label class="question-label"
                    >{labels.s2TransferQuestion}</label
                  >
                  <template lwc:if={transferBadge}>
                    <span class="badge">{transferBadge}</span>
                  </template>
                </div>
                <c-gx-rating-scale
                  data-field="transfer"
                  data-missing={invalidMap.transfer}
                  invalid={invalidMap.transfer}
                  value={answers.transfer.score}
                  comment={answers.transfer.comment}
                  min-label={labels.scaleVeryUnhappy}
                  max-label={labels.scaleVeryHappy}
                  aria-label={labels.s2TransferAria}
                  comment-prompt={labels.s2TransferPrompt}
                  comment-placeholder={labels.s2TransferHint}
                  onvaluechange={handleServiceScore}
                  oncommentchange={handleServiceComment}
                ></c-gx-rating-scale>
              </div>
            </template>

            <template lwc:if={ctx.hasRentalCar}>
              <div class="question">
                <div class="question-head">
                  <label class="question-label"
                    >{labels.s2RentalQuestion}</label
                  >
                  <template lwc:if={rentalBadge}>
                    <span class="badge">{rentalBadge}</span>
                  </template>
                </div>
                <c-gx-rating-scale
                  data-field="rentalCar"
                  data-missing={invalidMap.rentalCar}
                  invalid={invalidMap.rentalCar}
                  value={answers.rentalCar.score}
                  comment={answers.rentalCar.comment}
                  min-label={labels.scaleVeryUnhappy}
                  max-label={labels.scaleVeryHappy}
                  aria-label={labels.s2RentalAria}
                  comment-prompt={labels.s2RentalPrompt}
                  comment-placeholder={labels.s2RentalHint}
                  onvaluechange={handleServiceScore}
                  oncommentchange={handleServiceComment}
                ></c-gx-rating-scale>
              </div>
            </template>
          </section>
        </template>

        <!-- SCREEN 3 -->
        <template lwc:if={onHotels}>
          <section class="screen">
            <h2 class="title">{hotelsScreenTitle}</h2>

            <div class="cards">
              <template for:each={hotelCards} for:item="card">
                <c-gx-hotel-card
                  key={card.key}
                  hotel={card.hotel}
                  answer={card.answer}
                  invalid={card.invalid}
                  data-missing={card.invalid}
                  onscorechange={handleHotelScore}
                  oncommentchange={handleHotelComment}
                  onsubchange={handleHotelSub}
                ></c-gx-hotel-card>
              </template>
            </div>

            <div class="question">
              <label class="question-label" for="hotel-remarks"
                >{labels.s3Remarks}</label
              >
              <textarea
                id="hotel-remarks"
                class="textbox"
                rows="2"
                data-field="generalHotelComment"
                onchange={handleText}
              ></textarea>
            </div>
          </section>
        </template>

        <!-- SCREEN 4 -->
        <template lwc:if={onGolf}>
          <section class="screen">
            <h2 class="title">{labels.s4Title}</h2>

            <div class="cards">
              <template for:each={courseCards} for:item="card">
                <c-gx-course-card
                  key={card.key}
                  course={card.course}
                  answer={card.answer}
                  invalid={card.invalid}
                  data-missing={card.invalid}
                  onscorechange={handleCourseScore}
                  oncommentchange={handleCourseComment}
                ></c-gx-course-card>
              </template>
            </div>

            <div class="question">
              <label class="question-label" for="golf-remarks"
                >{labels.s4Remarks}</label
              >
              <textarea
                id="golf-remarks"
                class="textbox"
                rows="2"
                data-field="generalGolfComment"
                onchange={handleText}
              ></textarea>
            </div>
          </section>
        </template>

        <!-- SCREEN 5 -->
        <template lwc:if={onConclusion}>
          <section class="screen">
            <h2 class="title">{labels.s5Title}</h2>

            <div class="question">
              <label class="question-label">{labels.s5RecommendQuestion}</label>
              <c-gx-rating-scale
                data-field="recommendation"
                data-missing={invalidMap.recommendation}
                invalid={invalidMap.recommendation}
                value={answers.recommendation}
                min-label={labels.scaleVeryUnlikely}
                max-label={labels.scaleVeryLikely}
                aria-label={labels.s5RecommendAria}
                no-comment="true"
                onvaluechange={handleScore}
              ></c-gx-rating-scale>
            </div>

            <div class="question">
              <label class="question-label" for="bucket-list"
                >{labels.s5WishlistQuestion}</label
              >
              <textarea
                id="bucket-list"
                class="textbox"
                rows="2"
                data-field="nextDestination"
                placeholder={labels.s5WishlistHint}
                onchange={handleText}
              ></textarea>
            </div>

            <div class="question">
              <label class="question-label" for="final-remarks"
                >{labels.s5FinalQuestion}</label
              >
              <textarea
                id="final-remarks"
                class="textbox"
                rows="4"
                data-field="improvementSuggestions"
                placeholder={labels.s5FinalHint}
                onchange={handleText}
              ></textarea>
            </div>
          </section>
        </template>

        <template lwc:if={showMissingNote}>
          <p class="missing-note" role="alert">{labels.missingNote}</p>
        </template>

        <template lwc:if={submitError}>
          <p class="error" role="alert">{submitError}</p>
        </template>

        <nav class="nav">
          <template lwc:if={canGoBack}>
            <button
              type="button"
              class="btn btn_ghost"
              translate="no"
              disabled={submitting}
              onclick={handleBack}
            >
              {labels.buttonBack}
            </button>
          </template>
          <button
            type="button"
            class="btn btn_primary"
            translate="no"
            disabled={submitting}
            onclick={handleNext}
          >
            {nextLabel}
          </button>
        </nav>
      </template>

      <!-- SCREEN 6 -->
      <template lwc:if={onThanks}>
        <section class="screen screen_thanks">
          <div class="tick" aria-hidden="true">✓</div>
          <h2 class="title">{labels.thanksTitle}</h2>
          <p class="lead">{labels.thanksLead}</p>

          <template lwc:if={showPublicReview}>
            <p class="lead">{labels.thanksReviewText}</p>

            <template lwc:if={hasReviewLinks}>
              <div class="reviews">
                <h3 class="reviews-title">{labels.thanksReviewTitle}</h3>
                <div class="review-cards">
                  <template lwc:if={trustpilotUrl}>
                    <a
                      href={trustpilotUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      class="review-card"
                    >
                      <span class="review-stars">★★★★★</span>
                      <span class="review-name">Trustpilot</span>
                      <span class="review-cta">{labels.thanksTrustpilot}</span>
                    </a>
                  </template>
                  <template lwc:if={googleMapsUrl}>
                    <a
                      href={googleMapsUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      class="review-card"
                    >
                      <span class="review-stars">★★★★★</span>
                      <span class="review-name">Google</span>
                      <span class="review-cta">{labels.thanksGoogle}</span>
                    </a>
                  </template>
                </div>
              </div>
            </template>
          </template>

          <template lwc:else>
            <p class="lead">{labels.thanksOtherText}</p>
          </template>

          <p class="closing">{labels.thanksClosing}</p>

          <template lwc:if={reference}>
            <p class="reference">{referenceText}</p>
          </template>
        </section>
      </template>
    </div>
  </div>
</template>
