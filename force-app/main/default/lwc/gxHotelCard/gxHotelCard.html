<template>
  <article class="card">
    <header class="head">
      <c-gx-service-icon name="hotel"></c-gx-service-icon>
      <div class="head-text">
        <p class="kind">{labels.s3HotelKind}</p>
        <h3 class="name">{name}</h3>
        <template lwc:if={subtitle}>
          <p class="subtitle">{subtitle}</p>
        </template>
      </div>
    </header>

    <c-gx-rating-scale
      value={score}
      invalid={invalid}
      min-label={labels.scalePoor}
      max-label={labels.scaleExcellent}
      aria-label={ratingAriaLabel}
      no-comment="true"
      onvaluechange={handleScore}
    ></c-gx-rating-scale>

    <template lwc:if={showDetail}>
      <div class="detail">
        <p class="detail-intro">{labels.s3DetailIntro}</p>

        <template for:each={subRatings} for:item="sub">
          <div key={sub.key} class="sub">
            <span class="sub-label">{sub.label}</span>
            <c-gx-rating-scale
              value={sub.value}
              data-category={sub.key}
              min-label={labels.scalePoor}
              max-label={labels.scaleExcellent}
              aria-label={sub.label}
              compact="true"
              no-comment="true"
              onvaluechange={handleSubScore}
            ></c-gx-rating-scale>
          </div>
        </template>

        <div class="comment">
          <label class="comment-prompt" for="hotel-comment">
            {commentPrompt}
          </label>
          <textarea
            id="hotel-comment"
            class="comment-box"
            rows="2"
            placeholder={commentPlaceholder}
            oninput={handleComment}
            onchange={handleComment}
          ></textarea>
        </div>
      </div>
    </template>
  </article>
</template>
